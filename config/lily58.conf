# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# --- RADIO POWER ---
# Maximize signal to prevent "lost" Key-Up packets
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# --- DEBOUNCING (Preventing Ghost Keys) ---
# 7ms is the sweet spot for Lily58 switches to ensure signal clarity
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# --- CONNECTIVITY ---
# Helps with Windows/Linux dual boot and stable pairing
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Helps prevent disconnects by telling the PC to check in more often
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# Standard balance between latency and battery
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=10
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20

# --- DUAL BATTERY PLUMBING ---
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# 30 pictures * 60 seconds = 1,800,000 ms total duration
CONFIG_CUSTOM_ANIMATION_SPEED=1800000

CONFIG_ZMK_SLEEP=y
# 900,000 ms = 15 minutes before it enters deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Keep the screen on for 5 minutes, then go dark (saves the Left side's logic)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# --- CENTRAL SIDE OPTIMIZATION ---
# Increase the time between battery fetches from the right side (60s instead of 30s)
# This reduces the number of times the Left radio has to "ask" the Right for data
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# --- DISPLAY TWEAKS ---
# Explicitly ensure the display is using the most efficient refresh logic
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y