# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# --- RADIO POWER ---
# Maximize signal to prevent "lost" Key-Up packets
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- DEBOUNCING (Preventing Ghost Keys) ---
# 7ms is the sweet spot for Lily58 switches to ensure signal clarity
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# --- CONNECTIVITY ---
# Helps with Windows/Linux dual boot and stable pairing
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Helps prevent disconnects by telling the PC to check in more often
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# --- DUAL BATTERY PLUMBING ---
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
